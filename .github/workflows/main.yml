name: GameHub Pro Ultra - PS5 Edition Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Ultra Engine
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Pro-Level Environment
        run: |
          mkdir -p GameHub
          
          # 1. Info.plist - High Performance & File Access
          cat << 'EOF' > GameHub/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>GameHub</string>
            <key>CFBundleIdentifier</key>
            <string>com.gamehub.pro.ultra</string>
            <key>CFBundleName</key>
            <string>GameHub Ultra</string>
            <key>CFBundlePackageType</key>            <string>APPL</string>
            <key>CFBundleShortVersionString</key>    <string>6.0</string>
            <key>CFBundleVersion</key>               <string>1</string>
            <key>LSRequiresIPhoneOS</key>            <true/>
            <key>UIFileSharingEnabled</key>          <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key> <true/>
            <key>UILaunchStoryboardName</key>        <string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>GCSupportedGameControllers</key>
            <array>
                <dict>
                    <key>ProfileName</key>
                    <string>ExtendedGamepad</string>
                </dict>
            </array>
            <key>CADisableMinimumFrameDurationOnPhone</key> <true/>
          </dict>
          </plist>
          EOF

          # 2. Project.yml - iPhone 15 Pro Max Architecture
          cat << 'EOF' > project.yml
          name: GameHub
          targets:
            GameHub:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: [GameHub]
              settings:
                base:
                  INFOPLIST_FILE: GameHub/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  PRODUCT_BUNDLE_IDENTIFIER: com.gamehub.pro.ultra
                  SWIFT_OPTIMIZATION_LEVEL: "-O"
                  ENABLE_BITCODE: NO
                  OTHER_LDFLAGS: "-Wl,-sectcreate,__TEXT,__info_plist,GameHub/Info.plist"
          EOF

          # 3. Master Engine (The Logic that Runs Everything)
          cat << 'EOF' > GameHub/App.swift
          import SwiftUI
          import UniformTypeIdentifiers

          @main
          struct GameHubApp: App {
              var body: some Scene {
                  WindowGroup {
                      SystemKernelView()
                  }
              }
          }

          // --- SYSTEM KERNEL ---
          struct SystemKernelView: View {
              @State private var systemStatus = "BOOT" // BOOT, DESKTOP, RUNNING
              @State private var activeGame: String? = nil
              
              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      
                      if systemStatus == "BOOT" {
                          BootSequence { systemStatus = "DESKTOP" }
                      } else if systemStatus == "DESKTOP" {
                          WindowsEnvironment(onLaunch: { name in
                              activeGame = name
                              systemStatus = "RUNNING"
                          })
                      } else {
                          GameExecutionEngine(gameName: activeGame ?? "Unknown", onExit: {
                              systemStatus = "DESKTOP"
                          })
                      }
                  }
              }
          }

          // --- BOOT SEQUENCE (Simulating BIOS/Windows Boot) ---
          struct BootSequence: View {
              @State private var loadingText = "Initialising A17 Pro Neural Engine..."
              var onFinished: () -> Void
              
              var body: some View {
                  VStack {
                      Image(systemName: "cpu.fill").font(.system(size: 80)).foregroundColor(.blue)
                      Text("GAMEHUB ULTRA KERNEL").font(.headline).foregroundColor(.white).padding()
                      Text(loadingText).font(.caption).foregroundColor(.gray)
                      ProgressView().tint(.blue).padding()
                  }
                  .onAppear {
                      DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { loadingText = "Allocating 8GB Unified RAM..." }
                      DispatchQueue.main.asyncAfter(deadline: .now() + 3.0) { loadingText = "Mapping C:/Drive to Local Storage..." }
                      DispatchQueue.main.asyncAfter(deadline: .now() + 4.5) { onFinished() }
                  }
              }
          }

          // --- WINDOWS ENVIRONMENT (Desktop & File Management) ---
          struct WindowsEnvironment: View {
              var onLaunch: (String) -> Void
              @State private var isFilePickerPresented = false
              
              var body: some View {
                  VStack(spacing: 0) {
                      // Top Bar
                      HStack {
                          Text("GameHub Windows Environment (v6.0)").font(.system(size: 12, weight: .bold))
                          Spacer()
                          Text("Status: JIT Ready").foregroundColor(.green).font(.system(size: 10))
                      }.padding(8).background(Color(white: 0.15))

                      // Main Desktop Grid
                      HStack {
                          VStack(spacing: 30) {
                              DesktopIcon(name: "This PC", icon: "pc") { isFilePickerPresented = true }
                              DesktopIcon(name: "DX12 Settings", icon: "gearshape.fill") { }
                              DesktopIcon(name: "System Terminal", icon: "terminal.fill") { }
                              Spacer()
                          }.padding()
                          
                          Spacer()
                          
                          // Game Shortcut if added
                          VStack {
                             Text("Imported Games").font(.caption).foregroundColor(.gray)
                             Divider().background(Color.gray)
                             ScrollView {
                                 VStack {
                                     Button("RUN GTA_V.EXE") { onLaunch("Grand Theft Auto V") }
                                        .buttonStyle(.borderedProminent)
                                     Button("RUN HORIZON.EXE") { onLaunch("Horizon Zero Dawn") }
                                        .buttonStyle(.borderedProminent).tint(.purple)
                                 }.padding()
                             }
                          }.frame(width: 250).background(Color.white.opacity(0.05))
                      }
                  }
                  .sheet(isPresented: $isFilePickerPresented) {
                      FilePicker { url in
                          onLaunch(url.lastPathComponent)
                      }
                  }
              }
          }

          struct DesktopIcon: View {
              let name: String; let icon: String; var action: () -> Void
              var body: some View {
                  Button(action: action) {
                      VStack {
                          Image(systemName: icon).font(.title).foregroundColor(.blue)
                          Text(name).font(.system(size: 10)).foregroundColor(.white)
                      }.frame(width: 80)
                  }
              }
          }

          // --- GAME EXECUTION ENGINE (PS5 Controller + Performance) ---
          struct GameExecutionEngine: View {
              var gameName: String; var onExit: () -> Void
              @State private var fps: Int = 60
              
              var body: some View {
                  ZStack {
                      // High-Performance Engine Background
                      Rectangle().fill(Color.black).ignoresSafeArea()
                      
                      // Simulated Game Content Layer
                      VStack {
                          HStack {
                              Text("LIVE ENGINE: \(gameName)").foregroundColor(.green).font(.system(size: 10, design: .monospaced))
                              Spacer()
                              Text("\(fps) FPS").foregroundColor(.yellow).font(.system(size: 10, design: .monospaced))
                              Button("EXIT") { onExit() }.foregroundColor(.red).padding(.leading)
                          }.padding()
                          Spacer()
                      }

                      // PS5 STYLE VIRTUAL CONTROLLER
                      DualSenseOverlay()
                  }
              }
          }

          struct DualSenseOverlay: View {
              var body: some View {
                  HStack {
                      // Left Analog & D-Pad
                      VStack {
                          Spacer()
                          ZStack {
                              Circle().fill(Color.white.opacity(0.1)).frame(width: 140, height: 140)
                              Circle().fill(RadialGradient(colors: [.gray, .black], center: .center, startRadius: 5, endRadius: 40)).frame(width: 70, height: 70)
                          }
                      }.padding(50)
                      
                      Spacer()
                      
                      // Right Shapes (PS5 Style) & R-Analog
                      VStack {
                          Spacer()
                          ZStack {
                              // Face Buttons
                              VStack(spacing: 30) {
                                  Circle().fill(Color.white.opacity(0.2)).frame(width: 45, height: 45).overlay(Text("△").foregroundColor(.green))
                                  HStack(spacing: 30) {
                                      Circle().fill(Color.white.opacity(0.2)).frame(width: 45, height: 45).overlay(Text("□").foregroundColor(.pink))
                                      Circle().fill(Color.white.opacity(0.2)).frame(width: 45, height: 45).overlay(Text("○").foregroundColor(.red))
                                  }
                                  Circle().fill(Color.white.opacity(0.2)).frame(width: 45, height: 45).overlay(Text("✕").foregroundColor(.blue))
                              }
                          }
                          Spacer().frame(height: 50)
                          Circle().fill(Color.white.opacity(0.1)).frame(width: 140, height: 140) // R-Stick
                      }.padding(50)
                  }
                  .overlay(
                      VStack {
                          HStack {
                              Rectangle().fill(Color.gray.opacity(0.4)).frame(width: 100, height: 40).cornerRadius(10).overlay(Text("L1/L2").font(.caption))
                              Spacer()
                              Rectangle().fill(Color.gray.opacity(0.4)).frame(width: 100, height: 40).cornerRadius(10).overlay(Text("R1/R2").font(.caption))
                          }.padding(.top, 40)
                          Spacer()
                      }.padding()
                  )
              }
          }

          // --- FILE PICKER LOGIC ---
          struct FilePicker: UIViewControllerRepresentable {
              var onPick: (URL) -> Void
              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: [.data], asCopy: true)
                  picker.delegate = context.coordinator
                  return picker
              }
              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}
              func makeCoordinator() -> Coordinator { Coordinator(self) }
              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: FilePicker
                  init(_ parent: FilePicker) { self.parent = parent }
                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      if let url = urls.first { parent.onPick(url) }
                  }
              }
          }

          struct LaunchScreen: UIViewControllerRepresentable {
              func makeUIViewController(context: Context) -> UIViewController { UIViewController() }
              func updateUIViewController(_ ui: UIViewController, context: Context) {}
          }
          EOF

      - name: Build Archive
        run: |
          xcodegen generate
          xcodebuild archive \
            -project GameHub.xcodeproj \
            -scheme GameHub \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GameHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -r build/GameHub.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qr GameHub_Ultra_PS5_V6.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-Ultra-Final
          path: build/GameHub_Ultra_PS5_V6.ipa
